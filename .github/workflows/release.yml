name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: HOSCfg v${{ env.VERSION }}
          body: |
            ## HOSCfg v${{ env.VERSION }}

            MIUI Home Customizer Xposed module.

            ### Features
            - Hide drawer search bar
            - Custom drawer background color & transparency
            - Custom icon label color
            - Hide No SIM icon (SystemUI)
            - Settings toggle in MIUI Home drawer settings

            ### Installation
            1. Install the APK
            2. Enable the module in LSPosed Manager
            3. Enable scope for **MIUI Home** (com.miui.home) and **SystemUI** (com.android.systemui)
            4. Reboot
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
